<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Especial OWO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 1. INVITACIÓN INICIAL -->
<div class="contenedor" id="invitacion">
  <h2>¿Vamos a ver el atardecer a las 5 de la tarde? :3</h2>
  <div class="botones">
    <button class="btn" id="btnGo">Go pe</button>
    <button class="btn" id="btnNo">ño wakala</button>
  </div>
</div>

<!-- 2. MINIJUEGO (Oculto al inicio) -->
<div class="contenedor-juego oculto" id="pantalla-juego" hidden>
  <h2>¡Gáname una partida para aceptar! ❌⭕</h2>
  <p id="mensaje-juego">Tu turno (X)</p>
  <div class="tablero" id="tablero">
    <div class="celda" data-index="0"></div>
    <div class="celda" data-index="1"></div>
    <div class="celda" data-index="2"></div>
    <div class="celda" data-index="3"></div>
    <div class="celda" data-index="4"></div>
    <div class="celda" data-index="5"></div>
    <div class="celda" data-index="6"></div>
    <div class="celda" data-index="7"></div>
    <div class="celda" data-index="8"></div>
  </div>
</div>

<!-- 3. PANTALLA FINAL (Oculta al inicio) -->
<div class="pantalla-final oculto" id="resultado" hidden>
  <h1>YEI</h1>
  <p>✨disfrutemos el atardecer✨</p>
</div>

<script src="js/app.js"></script>
</body>
</html>
