<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Especial OWO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 1. INVITACIÓN INICIAL -->
<div class="contenedor" id="invitacion">
  <h2>¿Vamos a ver charlotte? :3</h2>
  <div class="botones">
    <button class="btn" id="btnGo">Go pe</button>
    <button class="btn" id="btnNo">ño wakala</button>
  </div>
</div>

<!-- 2. MINIJUEGO 1: TRES EN RAYA -->
<div class="contenedor-juego oculto" id="pantalla-juego">
  <h2>¡Gáname una partida para continuar! ❌⭕</h2>
  <p id="mensaje-juego">Tu turno (X)</p>
  <div class="tablero" id="tablero">
    <div class="celda" data-index="0"></div>
    <div class="celda" data-index="1"></div>
    <div class="celda" data-index="2"></div>
    <div class="celda" data-index="3"></div>
    <div class="celda" data-index="4"></div>
    <div class="celda" data-index="5"></div>
    <div class="celda" data-index="6"></div>
    <div class="celda" data-index="7"></div>
    <div class="celda" data-index="8"></div>
  </div>
</div>

<!-- 3. MINIJUEGO 2: LA SERPIENTE -->
<div class="contenedor-snake oculto" id="pantalla-snake">
  <h2>Agarra 5 minpaos para ganar 🐍🥟</h2>
  <p id="score-text">0 / 5 minpaos</p>
  <canvas id="snakeCanvas" width="300" height="300"></canvas>

  <div class="controles-tactiles">
    <button id="btnUp">⬆️</button>
    <div>
      <button id="btnLeft">⬅️</button>
      <button id="btnDown">⬇️</button>
      <button id="btnRight">➡️</button>
    </div>
  </div>
</div>

<!-- 4. PANTALLA FINAL (Con la imagen directa en HTML para que NUNCA vuelva a salir verde) -->
<!-- 4. PANTALLA FINAL -->
<div class="pantalla-final oculto" id="resultado">
  <div class="contenido-final">
    <h1>YEI</h1>
    <p>vamos a ver charlotte we</p>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
